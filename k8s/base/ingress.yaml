apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeunicorn-ingress
  namespace: codeunicorn
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: codeunicorn.example.com
      http:
        paths:
          # API routes → api-service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 4000
          # Everything else → web-service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000
